<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Nexus Narratio — дата рождения</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{--bg:var(--tg-theme-bg-color,#14110d);--text:var(--tg-theme-text-color,#e8e2d4);--hint:var(--tg-theme-hint-color,#8d8676);--line:color-mix(in srgb,var(--hint) 35%,transparent);--accent:#c9a86a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:30px 24px 130px;min-height:100vh}
  .brand{font-size:11px;letter-spacing:4px;color:var(--hint);text-transform:lowercase;margin-bottom:4px}
  h1{font-size:20px;font-weight:300;letter-spacing:1px;margin-bottom:10px}
  .lead{font-size:13px;line-height:1.55;color:var(--hint);margin-bottom:30px}
  label{display:block;font-size:10px;letter-spacing:2.5px;color:var(--hint);text-transform:lowercase;margin:24px 0 6px}
  .opt{opacity:.6;letter-spacing:1px;text-transform:none}
  .row{display:flex;gap:10px;align-items:baseline}
  input{background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--text);font-size:19px;font-weight:300;padding:8px 2px;outline:none;width:100%;border-radius:0;caret-color:var(--accent)}
  input:focus{border-color:var(--accent)}
  input::placeholder{color:color-mix(in srgb,var(--hint) 55%,transparent)}
  .dd{width:62px;text-align:center}.yy{width:92px;text-align:center}
  .sep{color:var(--hint);font-size:17px}
  .err{color:#b2604a;font-size:12.5px;margin-top:18px;min-height:18px}
  .foot{position:fixed;left:0;right:0;bottom:90px;text-align:center;font-size:11px;color:var(--hint);opacity:.5;letter-spacing:1px}
</style></head><body>
  <div class="brand">nexus narratio</div>
  <h1>Дата рождения</h1>
  <p class="lead">Джйотиш и Дизайн Человека настроят историю: мотивы, тени и конфликты героя станут твоими.</p>
  <label>дата</label>
  <div class="row">
    <input class="dd" id="d" type="tel" inputmode="numeric" maxlength="2" placeholder="дд">
    <span class="sep">·</span>
    <input class="dd" id="m" type="tel" inputmode="numeric" maxlength="2" placeholder="мм">
    <span class="sep">·</span>
    <input class="yy" id="y" type="tel" inputmode="numeric" maxlength="4" placeholder="гггг">
  </div>
  <label>время <span class="opt">(необязательно — уточнит расчёт)</span></label>
  <div class="row">
    <input class="dd" id="hh" type="tel" inputmode="numeric" maxlength="2" placeholder="чч">
    <span class="sep">:</span>
    <input class="dd" id="mi" type="tel" inputmode="numeric" maxlength="2" placeholder="мм">
  </div>
  <label>город <span class="opt">(необязательно)</span></label>
  <input id="c" type="text" placeholder="Москва" autocomplete="off">
  <div class="err" id="err"></div>
  <div class="foot">выбор не всегда очевиден</div>
<script>
  var BOT='https://dfymditepnttkcbayjhj.supabase.co/functions/v1/telegram-bot';
  var T=window.Telegram.WebApp;T.ready();T.expand();
  var $=function(id){return document.getElementById(id)};
  var err=function(m){$('err').textContent=m||''};
  T.MainButton.setText('Создать профиль');T.MainButton.show();
  Array.prototype.forEach.call(document.querySelectorAll('input[type=tel]'),function(el,i,list){
    el.addEventListener('input',function(){el.value=el.value.replace(/\D/g,'');if(el.value.length>=Number(el.maxLength)&&list[i+1])list[i+1].focus()});
  });
  T.MainButton.onClick(function(){
    err('');
    var d=+$('d').value,m=+$('m').value,y=+$('y').value;
    if(!d||!m||!y||d<1||d>31||m<1||m>12||y<1900||y>2030){err('проверь дату');return}
    var hh=$('hh').value,mi=$('mi').value;
    if(hh!==''&&(+hh<0||+hh>23)){err('часы 0–23');return}
    if(mi!==''&&(+mi<0||+mi>59)){err('минуты 0–59');return}
    T.MainButton.showProgress();
    fetch(BOT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      source:'miniapp',initData:T.initData,
      data:{type:'birth',day:d,month:m,year:y,hour:hh===''?'':+hh,minute:mi===''?'':+mi,city:$('c').value.trim()}
    })}).then(function(r){return r.json()}).then(function(res){
      if(res&&res.ok){T.close()}else{T.MainButton.hideProgress();err('ошибка, попробуй ещё раз')}
    }).catch(function(){T.MainButton.hideProgress();err('нет связи, попробуй ещё раз')});
  });
</script></body></html>
