<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Nexus Narratio — свой мир</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{--bg:var(--tg-theme-bg-color,#14110d);--text:var(--tg-theme-text-color,#e8e2d4);--hint:var(--tg-theme-hint-color,#8d8676);--line:color-mix(in srgb,var(--hint) 35%,transparent);--accent:#c9a86a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:30px 24px 130px;min-height:100vh}
  .brand{font-size:11px;letter-spacing:4px;color:var(--hint);text-transform:lowercase;margin-bottom:4px}
  h1{font-size:20px;font-weight:300;letter-spacing:1px;margin-bottom:10px}
  .lead{font-size:13px;line-height:1.55;color:var(--hint);margin-bottom:30px}
  label{display:block;font-size:10px;letter-spacing:2.5px;color:var(--hint);text-transform:lowercase;margin:24px 0 6px}
  input,textarea{background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--text);font-size:19px;font-weight:300;padding:8px 2px;outline:none;width:100%;border-radius:0;caret-color:var(--accent)}
  textarea{font-size:15px;line-height:1.5;border:1px solid var(--line);border-radius:10px;padding:12px 14px;resize:none}
  input:focus,textarea:focus{border-color:var(--accent)}
  input::placeholder,textarea::placeholder{color:color-mix(in srgb,var(--hint) 55%,transparent)}
  .err{color:#b2604a;font-size:12.5px;margin-top:18px;min-height:18px}
  .foot{position:fixed;left:0;right:0;bottom:90px;text-align:center;font-size:11px;color:var(--hint);opacity:.5;letter-spacing:1px}
</style></head><body>
  <div class="brand">nexus narratio</div>
  <h1>Свой мир</h1>
  <p class="lead">Опиши, где и о ком будет история — она построится строго по твоему замыслу.</p>
  <label>жанр</label>
  <input id="g" type="text" placeholder="киберпанк-нуар" autocomplete="off">
  <label>мир</label>
  <textarea id="w" rows="3" placeholder="мегаполис под вечным дождём, где память продают на чипах"></textarea>
  <label>герой</label>
  <textarea id="h" rows="3" placeholder="детектив-андроид, который начал видеть сны"></textarea>
  <div class="err" id="err"></div>
  <div class="foot">выбор не всегда очевиден</div>
<script>
  var BOT='https://dfymditepnttkcbayjhj.supabase.co/functions/v1/telegram-bot';
  var T=window.Telegram.WebApp;T.ready();T.expand();
  var $=function(id){return document.getElementById(id)};
  var err=function(m){$('err').textContent=m||''};
  T.MainButton.setText('Создать мир');T.MainButton.show();
  T.MainButton.onClick(function(){
    err('');
    var g=$('g').value.trim(),w=$('w').value.trim(),h=$('h').value.trim();
    if(!g&&!w&&!h){err('опиши хотя бы что-нибудь');return}
    T.MainButton.showProgress();
    fetch(BOT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      source:'miniapp',initData:T.initData,data:{type:'custom',genre:g,world:w,hero:h}
    })}).then(function(r){return r.json()}).then(function(res){
      if(res&&res.ok){T.close()}else{T.MainButton.hideProgress();err('ошибка, попробуй ещё раз')}
    }).catch(function(){T.MainButton.hideProgress();err('нет связи, попробуй ещё раз')});
  });
</script></body></html>
